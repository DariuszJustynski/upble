<!-- INCLUDE: layout/header.html -->
<div id="content">

  <div class="box">
    <h3>Your account is still not activated. Get another activation code</h3>
    <form action="/ucp/send_again" method="post">
      <table class="user_table">

        <tr>
          <td><label for="email">Email Address</label></td>
          <td><input type="text" name="email" id="email" value="{{form.email}}" maxlength="80" size="30" /></td>
          <td style="color:red;">{{errors.email}}</td>
        </tr>

        <tr>
          <td>&nbsp;</td>
          <td><button type="submit" name="send">Send</button></td>
          <td>&nbsp;</td>
        </tr>

      </table>
    </form>
  </div>

</div>
<!-- INCLUDE: layout/footer.html -->
