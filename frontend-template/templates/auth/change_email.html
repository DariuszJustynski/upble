<!-- INCLUDE: layout/header.html -->
<div id="content">
  <div id="top" class="clearfix">
    <div class="span-16"><h1>Change Your Email Address</h1></div>
  </div>

  <div class="box">
    <form action="/ucp/change_email" method="post">
      <table>

        <tr>
          <td><label for="password">Password</label></td>
          <td><input type="password" name="password" id="password" size="30" /></td>
          <td style="color:red;">{{errors.password}}</td>
        </tr>

        <tr>
          <td><label for="email">New email address</label></td>
          <td><input type="text" name="email" id="email" value="{{form.email}}" maxlength="80" size="30" /></td>
          <td style="color:red;">{{errors.email}}</td>
        </tr>

      </table>
      <button type="submit" name="change">Send confirmation email</button>
    </form>
  </div>

</div>
<!-- INCLUDE: layout/footer.html -->
