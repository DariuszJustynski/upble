<!-- INCLUDE: layout/header.html -->
<div id="content">
  <div id="top" class="clearfix">
    <div class="span-16"><h1>Change Password</h1></div>
  </div>

  <div class="box">
    <form action="/ucp/change_password" method="post">
      <table class="user_table">

        <tr>
          <th><label for="old_password">Old Password</label></th>
          <td><input type="password" name="old_password" id="old_password" size="30" /></td>
          <td style="color:red;">{{errors.old_password}}</td>
        </tr>

        <tr>
          <th><label for="new_password">New Password</label></th>
          <td><input type="password" name="new_password" id="new_password" size="30" /></td>
          <td style="color:red;">{{errors.new_password}}</td>
        </tr>

        <tr>
          <th><label for="confirm_new_password">Confirm New Password</label></th>
          <td><input type="password" name="confirm_new_password" id="confirm_new_password" size="30" /></td>
          <td style="color:red;">{{errors.confirm_new_password}}</td>
        </tr>

        <tr>
          <td>&nbsp;</td>
          <td><button type="submit" name="change">Change Password</button></td>
          <td>&nbsp;</td>
        </tr>

      </table>
    </form>
  </div>

</div>
<!-- INCLUDE: layout/footer.html -->
