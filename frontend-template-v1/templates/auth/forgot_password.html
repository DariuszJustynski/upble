<!-- INCLUDE: layout/header.html -->
<div id="content">
  <div id="top" class="clearfix">
    <div class="span-16"><h1>Forgot Password</h1></div>
  </div>

  <div class="box">
    <form action="/ucp/forgot_password" method="post">
      <table class="user_table">

        <tr>
          <th><label for="login">Email or login</label></th>
          <td>
            <input type="text" name="login" id="login" value="{{form.login}}" maxlength="80" size="30" />
          </td>
          <td style="color:red;">{{errors.login}}</td>
        </tr>

        <tr>
          <td>&nbsp;</td>
          <td><button type="submit" name="reset">Get a new password</button></td>
          <td>&nbsp;</td>
        </tr>

      </table>
    </form>
  </div>

</div>
<!-- INCLUDE: layout/footer.html -->
