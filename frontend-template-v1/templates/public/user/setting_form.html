<!-- INCLUDE: layout/header.html -->
<div id="content">
  <div id="top" class="clearfix">
    <div class="span-16"><h1>Profile setting</h1></div>
  </div>

  <div class="box">
    <form action="/mcp/setting" method="post" enctype="multipart/form-data">
      <table cellpadding="0" cellspacing="0" class="user_table">

        <!-- Current avatar preview -->
        <tr>
          <th></th>
          <td>
            <img class="thumbimg" src="/upload/avatar/{{user.avatar_big_path}}"
                 alt="{{user.name}} avatar" />
          </td>
        </tr>

        <!-- Avatar upload -->
        <tr>
          <th>avatar</th>
          <td>
            <span class="note">Only jpg/png/gif format is allowed and max size should be under 1MB.</span><br />
            <input type="file" name="picture" id="picture" />
            <span style="color:red;">{{errors.picture}}</span>
          </td>
        </tr>

        <!-- Website -->
        <tr>
          <th><label for="website">Website</label></th>
          <td>
            <input type="text" name="website" id="website"
                   value="{{user.profile.website}}" maxlength="255" size="30" />
            <span style="color:red;">{{errors.website}}</span>
          </td>
        </tr>

        <!-- City -->
        <tr>
          <th><label for="city">City</label></th>
          <td>
            <span class="note">The city you are currently living in.</span><br />
            <input type="text" name="city" id="city"
                   value="{{user.profile.city}}" maxlength="255" size="30" />
            <span style="color:red;">{{errors.city}}</span>
          </td>
        </tr>

        <!-- About Me -->
        <tr>
          <th style="vertical-align:top;">
            <label for="about_me">About Me</label>
          </th>
          <td>
            <textarea name="about_me" id="about_me"
                      maxlength="700" cols="50" rows="5">{{user.profile.about_me}}</textarea>
            <span style="color:red;">{{errors.about_me}}</span>
          </td>
        </tr>

        <tr>
          <th>&nbsp;</th>
          <td><button type="submit" class="submit">Submit</button></td>
        </tr>

      </table>
    </form>
  </div>
</div>
<!-- INCLUDE: layout/footer.html -->
