<!-- INCLUDE: layout/header.html -->
<div id="content">
  <div class="wrap clearfix">

    <div id="main" class="span-16">
      <div class="box last_box">

        <div class="heading">
          <h2>Newest Reviews In {{city.name}}</h2>
        </div>

        <div class="info">
          <ul id="newreview">

            <!-- REPEAT: one <li> per review -->
            <li class="clearfix">
              <div class="span-1">
                <a href="/member/{{review.username}}">
                  <img class="thumbimg thumb40" src="/upload/avatar/{{review.avatar_path}}" alt="{{review.username}}" />
                </a>
              </div>
              <div class="span-13">
                <div class="title-name">
                  <a href="/member/{{review.username}}">{{review.username}}</a>
                  reviewed
                  <a href="/biz/{{business.id}}#review_{{review.id}}">{{business.name}}</a>
                </div>
                <div class="span-3 rating-wrap rating-{{review.rating}}"></div>
                <p class="clear">{{review.excerpt}}</p>
              </div>
            </li>

            <li class="clearfix">
              <div class="span-1">
                <a href="/member/{{review.username}}">
                  <img class="thumbimg thumb40" src="/upload/avatar/{{review.avatar_path}}" alt="{{review.username}}" />
                </a>
              </div>
              <div class="span-13">
                <div class="title-name">
                  <a href="/member/{{review.username}}">{{review.username}}</a>
                  reviewed
                  <a href="/biz/{{business.id}}#review_{{review.id}}">{{business.name}}</a>
                </div>
                <div class="span-3 rating-wrap rating-{{review.rating}}"></div>
                <p class="clear">{{review.excerpt}}</p>
              </div>
            </li>

          </ul>
        </div>

      </div>
    </div>

    <div id="side" class="span-8 last">
      <div class="box last_box"></div>
    </div>

  </div>
</div>
<!-- INCLUDE: layout/footer.html -->
