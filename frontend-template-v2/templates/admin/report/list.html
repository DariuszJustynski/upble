<!-- INCLUDE: admin/layout/header.html -->
<!-- Data: list[], pagination.links -->

<div id="content">
  <div class="page-header"><h3>Content Flagged By Users</h3></div>

  <div class="box">
    <form action="/admin/report/del" method="post">
      <table class="table">
        <thead>
          <tr>
            <td class="selected last"></td>
            <th class="left">Reporter</th>
            <th>Link</th>
            <th>Reason</th>
            <th>Report Time</th>
          </tr>
        </thead>
        <tbody>

          <!-- REPEAT: one <tr> per report -->
          <tr>
            <td class="selected last">
              <input type="checkbox" name="id[]" value="{{report.id}}" />
            </td>
            <td>
              <a href="/member/{{report.username}}" target="_blank">{{report.username}}</a>
            </td>
            <td>
              <a href="{{report.url}}" target="_blank">{{report.url}}</a>
            </td>
            <td>{{report.comment}}</td>
            <td>{{report.created_at}}</td>
          </tr>
          <!-- /REPEAT -->

        </tbody>
      </table>

      <div class="results">
        {{pagination.links}}
      </div>

      <div class="form-actions">
        <input type="submit" class="btn" name="submit" value="Delete Selected Items" />
      </div>
    </form>
  </div>
</div>

<!-- INCLUDE: admin/layout/footer.html -->
