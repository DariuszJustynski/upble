<!-- INCLUDE: layout/header.html -->
<!-- Used for both Add Review and Edit Review.
     When editing: business.id and review.id are set, form action = /review/edit/{bizid}/{id} -->
<div id="content">

  <div id="top" class="clearfix">
    <!-- Edit mode: show business name as link -->
    <div class="span-12">
      <a href="/biz/{{business.id}}"><h1>{{business.name}}</h1></a>
    </div>
    <!-- Add mode: generic heading
    <div class="span-5"><h1>Add A Review</h1></div>
    -->
  </div>

  <div class="box last_box">
    <form action="/review/edit/{{business.id}}/{{review.id}}" method="post">
      <table cellpadding="0" cellspacing="0" class="user_table biz_table">
        <input type="hidden" name="id"    value="{{review.id}}" />
        <input type="hidden" name="bizid" value="{{business.id}}" />

        <!-- Validation error for bizid -->
        <tr>
          <td>&nbsp;</td>
          <td><span style="color:red;">{{errors.bizid}}</span></td>
        </tr>

        <tr>
          <th style="vertical-align:middle;">Rating:</th>
          <td>
            <div style="width:200px;">
              <div class="rating-block">
                <input type="hidden" name="rating" id="rating" value="{{review.rating}}" />
                <ul>
                  <li><a class="star-1" rating-value="1" title="very poor" href="javascript:void(0);"></a></li>
                  <li><a class="star-2" rating-value="2" title="poor" href="javascript:void(0);"></a></li>
                  <li><a class="star-3" rating-value="3" title="average" href="javascript:void(0);"></a></li>
                  <li><a class="star-4" rating-value="4" title="good" href="javascript:void(0);"></a></li>
                  <li><a class="star-5" rating-value="5" title="excellent" href="javascript:void(0);"></a></li>
                </ul>
              </div>
              <span class="rating-hint">click to rate</span>
            </div>
          </td>
        </tr>

        <tr>
          <th style="vertical-align:top;">Review:</th>
          <td>
            <textarea cols="50" rows="15" name="content">{{review.content}}</textarea>
            <span style="color:red;">{{errors.content}}</span>
          </td>
        </tr>

        <tr>
          <th>&nbsp;</th>
          <td><button type="submit" class="submit">Submit</button></td>
        </tr>

      </table>
    </form>
  </div>
</div>

<script type="text/javascript">
  $(function() {
    /* Pre-select star rating if editing an existing review */
    var rating = parseInt('{{review.rating}}', 10);
    if (rating > 0) {
      $('#rating').val(rating);
      $('.star-' + rating).addClass('active-star');
      $(".rating-hint").html($(".star-" + rating).attr("title"));
    }
  });
</script>
